plugins {
    id "com.android.application"
}

android {
    namespace "com.ridepy.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "com.ridepy.mobile"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "androidx.activity:activity:1.13.0"
}
