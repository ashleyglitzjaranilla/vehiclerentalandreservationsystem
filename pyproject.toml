[project]
name = "vehicle-rental"
version = "0.1.0"
description = "A Flask + SQLAlchemy vehicle rental and reservation system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is run from the project root, not installed as a package.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytailwindcss>=0.3.1",
    "pytest>=9.1.1",
]
