{# Inline SVG icons, so the project needs no icon font and no extra requests. #}

{% macro icon(name, cls='h-5 w-5') %}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == 'dashboard' -%}
    <rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
    <rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>
  {%- elif name == 'car' -%}
    <path d="M3 13.5 4.9 8.2A2 2 0 0 1 6.8 6.9h10.4a2 2 0 0 1 1.9 1.3L21 13.5"/>
    <path d="M2.8 13.5h18.4V17a1 1 0 0 1-1 1h-1.6a1 1 0 0 1-1-1v-.9H6.4v.9a1 1 0 0 1-1 1H3.8a1 1 0 0 1-1-1v-3.5Z"/>
    <path d="M6.8 15.6h.01M17.2 15.6h.01"/>
  {%- elif name == 'plus' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 8.2v7.6M8.2 12h7.6"/>
  {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
  {%- elif name == 'report' -%}
    <path d="M3 20.5h18"/><path d="M6 20.5v-6M11 20.5V6M16 20.5v-9"/>
  {%- elif name == 'logout' -%}
    <path d="M9.5 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.5"/><path d="m16 16.5 4.5-4.5L16 7.5"/><path d="M20.5 12H10"/>
  {%- elif name == 'check' -%}
    <circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-4.9"/>
  {%- elif name == 'wrench' -%}
    <path d="M15.5 6.5a4 4 0 0 0-5.2 5.2L4 18l2 2 6.3-6.3a4 4 0 0 0 5.2-5.2l-2.4 2.4-2.1-2.1 2.5-2.3Z"/>
  {%- elif name == 'archive' -%}
    <rect x="3" y="4" width="18" height="4.5" rx="1.5"/><path d="M5 8.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V8.5"/><path d="M10 12.5h4"/>
  {%- elif name == 'download' -%}
    <path d="M12 3.5v11M8 11l4 3.5 3.5-3.5"/><path d="M4.5 19.5h15"/>
  {%- elif name == 'print' -%}
    <path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="7.5" rx="1.5"/><path d="M7 14h10v6.5H7z"/>
  {%- elif name == 'eye' -%}
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/>
  {%- elif name == 'menu' -%}
    <path d="M4 7h16M4 12h16M4 17h16"/>
  {%- elif name == 'warning' -%}
    <path d="M12 4.5 2.8 19.5h18.4L12 4.5Z"/><path d="M12 10v4M12 17h.01"/>
  {%- elif name == 'money' -%}
    <rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>
    <path d="M6 12h.01M18 12h.01"/>
  {%- elif name == 'calendar' -%}
    <rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
  {%- elif name == 'users' -%}
    <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/>
    <path d="M16 5.2a3.5 3.5 0 0 1 0 6.6M17.5 20a6.5 6.5 0 0 0-2-4.7"/>
  {%- endif -%}
</svg>
{% endmacro %}
